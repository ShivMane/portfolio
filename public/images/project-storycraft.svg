  <!-- AI badge -->
  <rect x="560" y="295" width="140" height="30" rx="8" fill="rgba(139,92,246,0.3)" stroke="rgba(139,92,246,0.5)" stroke-width="1"/>
  <text x="630" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="rgba(167,139,250,0.9)">( AI Assist</text>

  <text x="400" y="428" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="rgba(167,139,250,0.9)">StoryCraft</text>
