  <line x1="430" y1="105" x2="570" y2="150" stroke="rgba(34,211,238,0.4)" stroke-width="2"/>
  <line x1="430" y1="215" x2="570" y2="165" stroke="rgba(167,139,250,0.4)" stroke-width="2"/>
  <!-- Editor panel -->
  <rect x="80" y="280" width="640" height="120" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="100" y="300" width="400" height="10" rx="5" fill="rgba(255,255,255,0.5)"/>
  <rect x="100" y="320" width="500" height="7" rx="3.5" fill="rgba(255,255,255,0.2)"/>
