      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Story graph nodes -->
  <circle cx="200" cy="150" r="30" fill="rgba(139,92,246,0.3)" stroke="rgba(139,92,246,0.7)" stroke-width="2"/>
