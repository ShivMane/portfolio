<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="60" y="40" width="680" height="340" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <rect x="60" y="40" width="680" height="40" rx="14" fill="rgba(0,0,0,0.4)"/>
  <circle cx="90" cy="60" r="7" fill="#ef4444"/>
  <circle cx="114" cy="60" r="7" fill="#f59e0b"/>
  <circle cx="138" cy="60" r="7" fill="#22c55e"/>
  <text x="400" y="65" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(148,163,184,0.5)">Terminal</text>
  <!-- Terminal lines -->
  <text x="90" y="110" font-family="monospace" font-size="13" fill="rgba(34,211,238,0.9)">$ envoy pull --env production</text>
  <text x="90" y="135" font-family="monospace" font-size="13" fill="rgba(148,163,184,0.6)"> Decrypting secrets...</text>
  <text x="90" y="158" font-family="monospace" font-size="13" fill="rgba(148,163,184,0.6)"> Fetched 12 variables from .envoy.yaml</text>
  <text x="90" y="181" font-family="monospace" font-size="13" fill="rgba(34,211,238,0.9)">$ envoy run -- npm start</text>
  <text x="90" y="204" font-family="monospace" font-size="13" fill="rgba(34,197,94,0.8)"> Injected environment variables</text>
  <text x="90" y="227" font-family="monospace" font-size="13" fill="rgba(148,163,184,0.4)">> portfolio@1.0.0 start</text>
  <text x="90" y="250" font-family="monospace" font-size="13" fill="rgba(148,163,184,0.4)">> node dist/index.js</text>
  <text x="90" y="273" font-family="monospace" font-size="13" fill="rgba(34,197,94,0.7)">Server running on http://localhost:3000</text>
  <!-- Blinking cursor -->
  <rect x="90" y="290" width="8" height="16" fill="rgba(139,92,246,0.8)"/>

  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="rgba(167,139,250,0.9)">Envoy CLI</text>
</svg>
