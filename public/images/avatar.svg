<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Body -->
  <ellipse cx="200" cy="360" rx="110" ry="70" fill="#4c1d95"/>
  <!-- Head -->
  <circle cx="200" cy="200" r="80" fill="url(#skin)"/>
  <!-- Hair -->
  <ellipse cx="200" cy="140" rx="80" ry="40" fill="#1e1b4b"/>
  <ellipse cx="200" cy="160" rx="80" ry="30" fill="#1e1b4b"/>
  <!-- Eyes -->
  <circle cx="175" cy="195" r="10" fill="#1e1b4b"/>
  <circle cx="225" cy="195" r="10" fill="#1e1b4b"/>
  <circle cx="178" cy="192" r="3" fill="white"/>
  <circle cx="228" cy="192" r="3" fill="white"/>
  <!-- Smile -->
  <path d="M178 220 Q200 238 222 220" stroke="#1e1b4b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Code icon overlay -->
  <text x="200" y="320" text-anchor="middle" font-family="monospace" font-size="28" fill="rgba(167,139,250,0.6)">&lt;/&gt;</text>
</svg>
